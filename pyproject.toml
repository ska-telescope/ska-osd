[tool.poetry]
name = "ska-ost-osd"
version = "6.0.9"
description = "Simplest form OSD consists of configuration files that are required by OSO tools."
authors =  ["Team Nakshatra"]
license= "BSD-3-Clause"
readme = "README.md"
repository = "https://gitlab.com/ska-telescope/ost/ska-ost-osd"
documentation = "https://developer.skao.int/projects/ska-ost-osd/en/latest"
packages = [
    { include = "ska_ost_osd", from = "src" }
]
include = [
    { path = 'tests' }
]

classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'License :: OSI Approved :: BSD License',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]


[[tool.poetry.source]]
name = 'ska-nexus'
url = 'https://artefact.skao.int/repository/pypi-internal/simple'

[[tool.poetry.source]]
name = 'PyPI'
priority = 'primary'

[tool.poetry.dependencies]
python = "^3.11"
ska-ser-logging = ">=0.4.1"
ska-telmodel-client = "^1.30.0"
ska-schemas = "^1.35.0"
astropy = "^8.0"
simpleeval = "^1.0.8"
pydantic = "^2.10.3"
fastapi = {extras = ["standard"], version = ">=0.115.8"}


[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
pylint = "^4.0.8"
pytest = "^9.1.1"
pytest-bdd = "^8.1.0"
pytest-cov = "^7.1.0"
isort = "^9.0.1"
flake8 = "^7.3.0"
pylint-junit = "^0.3.5"
coverage = "^7.16.1"
pytest-json-report = "^1.5.0"
pytest-forked = "^1.7.5"
pytest-mock = "^3.15.1"
pytest-xdist = "^3.8.0"
pytest-repeat = "^0.9.4"
pytest-timeout = "^2.4.0"
platformdirs = "^4.11.8"
requests-mock = "^1.12.1"


[tool.poetry.group.docs.dependencies]
sphinxcontrib-openapi = "^0.9.0"
ska-ser-sphinx-theme = "^0.2.1"
recommonmark = "^0.7.1"
sphinx_autodoc_typehints = "^3.6.1"
fastapi = {extras = ["standard"], version = ">=0.115.8"}

[tool.pytest.ini_options]
addopts = "-v"

[tool.flake8]
docstring-style = "sphinx"
rst-directives = "literalinclude"
rst-roles = ["py:attr", "py:class", "py:const", "py:exc", "py:func", "py:meth", "py:mod"]
enable = "DAR104"
max-complexity = 10

# E203 and W503 conflict with black
ignore = ["E203", "W503"]

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "fixme",
]
enable = ["useless-suppression"]

[tool.pylint.typecheck]
# astropy.units.hour - pylint matches against usage not qualified name
generated-members = "u.hour"

[tool.pylint.similarities]
min-similarity-lines = 7
ignore-imports = "yes"


[tool.black]
line-length = 88
preview = true
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | src/ska_ost_osd/rest/openapi/__submodules__
  )/
  | foo.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

[tool.isort]
profile = "black"
line_length = 88

[tool.pylint]
disable = "C,R,W3101,W0511"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
