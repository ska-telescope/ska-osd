[project]
name = "ska-ost-osd"
version = "6.0.9"
description = "Simplest form OSD consists of configuration files that are required by OSO tools."
authors = [{ name = "Team Nakshatra" }]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<4.0"
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
]
dependencies = [
    "ska-ser-logging>=0.4.1",
    "ska-telmodel-client>=1.30.0,<2.0.0",
    "ska-schemas>=1.35.0,<2.0.0",
    "astropy>=8.0,<9.0",
    "simpleeval>=1.0.8,<2.0.0",
    "pydantic>=2.10.3,<3.0.0",
    "fastapi[standard]>=0.115.8",
]

[project.urls]
repository = "https://gitlab.com/ska-telescope/ost/ska-ost-osd"
documentation = "https://developer.skao.int/projects/ska-ost-osd/en/latest"

[dependency-groups]
dev = [
    "ruff>=0.16.8,<0.17.0",
    "pytest>=9.1.1,<10.0.0",
    "pytest-bdd>=8.1.0,<9.0.0",
    "pytest-cov>=7.1.0,<8.0.0",
    "coverage>=7.16.1,<8.0.0",
    "pytest-json-report>=1.5.0,<2.0.0",
    "pytest-forked>=1.7.5,<2.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "pytest-xdist>=3.8.0,<4.0.0",
    "pytest-repeat>=0.9.4,<0.10.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "platformdirs>=4.11.8,<5.0.0",
    "requests-mock>=1.12.1,<2.0.0",
]
docs = [
    "sphinxcontrib-openapi>=0.9.0,<0.10.0",
    "ska-ser-sphinx-theme>=0.2.1,<0.3.0",
    "recommonmark>=0.7.1,<0.8.0",
    "sphinx-autodoc-typehints>=3.6.1,<4.0.0",
    "fastapi[standard]>=0.115.8",
]

[[tool.uv.index]]
name = "ska-nexus"
url = "https://artefact.skao.int/repository/pypi-internal/simple"

[tool.uv.build-backend]
source-include = ["tests/**"]

[tool.pytest.ini_options]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [
    ".make",
    "src/ska_ost_osd/rest/openapi/__submodules__",
]

[tool.ruff.lint]
select = [
    # pycodestyle errors
    "E",
    # Pyflakes
    "F",
    # pycodestyle warnings
    "W",
    # isort
    "I",
    # Pylint errors and warnings (conventions/refactors excluded)
    "PLE",
    "PLW",
]
ignore = [
    # line length (enforced by the formatter instead)
    "E501",
]

[tool.ruff.format]
docstring-code-format = true

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
