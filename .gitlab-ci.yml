default:
  image: $SKA_K8S_TOOLS_BUILD_DEPLOY
  tags:
    - $SKA_DEFAULT_RUNNER

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  UV_VERSION: "0.12.15"
  DOCS_RTD_PROJECT_SLUG: ska-telescope-ska-ost-osd

# The YAML file defines a set of jobs with constraints stating when they should be run.
# You can specify an unlimited number of jobs which are defined as top-level elements with an arbitrary name and always have to contain at least the script clause.
# In this case we have only the test job which produce an artifacts (it must be placed into a directory called "public")
# It is also specified that only the master branch will be subject of this job.

# non build and test stages hidden https://docs.gitlab.com/ee/ci/yaml/README.html#hide-jobs
stages:
  - build
  - validate
  - test
  - lint
  - publish
  - pages
  - scan

include:
  # Python
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/python-uv.gitlab-ci.yml"
  # Docs pages
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/docs.gitlab-ci.yml"
  # .post step finalisers eg: badges
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/finaliser.gitlab-ci.yml"
  # change log
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/changelog.gitlab-ci.yml"
  # release notes
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/release.gitlab-ci.yml"
  # Telescope model data job
  - project: "ska-telescope/templates-repository"
    file: "gitlab-ci/includes/tmdata.gitlab-ci.yml"
  # SonarQube
  - project: 'ska-telescope/templates-repository'
    file: 'gitlab-ci/includes/sonar-scan.gitlab-ci.yml'

tmdata-validate:
  stage: validate
  needs: []
  script:
    - make tmdata-validate

# Publishing is manual, and only from the default branch: tags are for software
# releases, and other branches, including merge request pipelines, must not
# publish data.
# To ensure an older pipeline can't publish over a newer one:
#   - The resource group runs no more than one publish at a time.
#   - The environment with setting "Prevent outdated deployment jobs" will
#     refuse a publish job from an earlier pipeline than the one that is live.
# Both are prefixed with "tmdata" to distinguish them from any resource groups
# or environments for the ska-ost-osd library itself.
tmdata-publish:
  needs:
    - tmdata-build
    - tmdata-validate
    - python-uv-test
  resource_group: tmdata-$CI_COMMIT_REF_NAME
  environment:
    name: tmdata/$CI_COMMIT_REF_NAME
  # Skips publishing if the CAR already serves this tmdata for the ref. After
  # publishing, checks again and fails the job if the CAR doesn't serve it:
  # make tmdata-publish exits successfully even when the upload is rejected.
  script:
    - |
      if make tmdata-check-published; then
        echo "Not publishing: the tmdata is already published"
        exit 0
      fi
    - make tmdata-publish
    - make tmdata-check-published
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
